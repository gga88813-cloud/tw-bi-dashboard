<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营团队 BI 看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header .date-info { font-size: 13px; opacity: 0.7; }
  .filter-bar { background: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; }
  .filter-label { font-size: 13px; color: #666; font-weight: 500; }
  .group-tabs { display: flex; gap: 6px; }
  .group-tab { padding: 6px 18px; border-radius: 20px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .group-tab:hover { border-color: #1890ff; color: #1890ff; }
  .group-tab.active { background: #1890ff; color: #fff; border-color: #1890ff; }
  .person-select { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; min-width: 140px; outline: none; }
  .person-select:focus { border-color: #1890ff; }
  .date-input { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; outline: none; width: 120px; }
  .date-input:focus { border-color: #1890ff; }
  .date-reset { padding: 6px 14px; border-radius: 20px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 12px; transition: all 0.2s; color: #666; }
  .date-reset:hover { border-color: #ff4d4f; color: #ff4d4f; }
  .date-shortcuts { display: flex; gap: 4px; }
  .date-shortcut { padding: 5px 12px; border-radius: 16px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 12px; transition: all 0.2s; color: #555; }
  .date-shortcut:hover { border-color: #1890ff; color: #1890ff; }
  .date-shortcut.active { background: #e6f7ff; border-color: #1890ff; color: #1890ff; font-weight: 600; }
  .container { padding: 20px 32px; max-width: 1600px; margin: 0 auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .kpi-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .kpi-card .value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
  .kpi-card .sub { font-size: 12px; color: #999; margin-top: 4px; }
  .kpi-trend { font-size: 12px; margin-top: 4px; font-weight: 500; }
  .kpi-trend.up { color: #52c41a; }
  .kpi-trend.down { color: #ff4d4f; }
  .kpi-trend.flat { color: #bbb; }
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: relative; }
  .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; }
  .chart-wrap { position: relative; width: 100%; height: 300px; }
  .chart-wrap.tall { height: 400px; }
  .full-width { grid-column: 1 / -1; }
  .table-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; overflow-x: auto; }
  .table-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #fafafa; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #f5f7ff; }
  .group-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .group-badge.g1 { background: #e6f7ff; color: #1890ff; }
  .group-badge.g2 { background: #fff7e6; color: #fa8c16; }
  .group-badge.g3 { background: #f6ffed; color: #52c41a; }
  .person-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .person-mini { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
  .person-mini:hover { border-color: #1890ff; transform: translateY(-2px); }
  .person-mini.active { border-color: #1890ff; }
  .person-mini .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .person-mini .role { font-size: 12px; color: #999; }
  .person-mini .stats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .person-mini .stat { font-size: 11px; color: #666; }
  .person-mini .stat span { font-weight: 700; color: #1a1a2e; font-size: 14px; display: block; }
  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(3, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .container { padding: 12px 16px; }
  }
  /* Sync button hover */
  #syncBtn:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.55); }
  #syncBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  /* Sync toast */
  .sync-toast { position: fixed; top: 20px; right: 24px; background: #1a1a2e; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 9999; display:flex;align-items:center;gap:8px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); transform: translateY(-60px); opacity:0; transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  .sync-toast.show { transform: translateY(0); opacity:1; }
  /* Summary card */
  .summary-card { background: #fff; border-radius: 12px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-top: 20px; border-top: 3px solid #1890ff; }
  .summary-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .summary-body { font-size: 14.5px; line-height: 2; color: #444; }
  .summary-body p { margin: 0 0 8px; }
  .copy-btn { display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:1.5px solid #1890ff;background:#fff;color:#1890ff;font-size:13px;cursor:pointer;font-weight:600;transition:all 0.2s; }
  .copy-btn:hover { background:#e6f7ff; }
  .copy-btn.copied { background:#52c41a;border-color:#52c41a;color:#fff; }
  /* Summary text colors */
  .txt-good { color: #389e0d; font-weight: 600; }
  .txt-warn { color: #d46b08; font-weight: 600; }
  .txt-danger { color: #cf1322; font-weight: 600; }
  .txt-good-bg { background: #f6ffed; border-radius: 3px; padding: 0 4px; }
  .txt-warn-bg { background: #fff7e6; border-radius: 3px; padding: 0 4px; }
  .txt-danger-bg { background: #fff1f0; border-radius: 3px; padding: 0 4px; }

  /* ═══ 深色模式 ═══ */
  .theme-toggle{padding:7px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.12);color:#fff;font-size:13px;cursor:pointer;transition:all 0.2s;}
  .theme-toggle:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.55);}

  body.dark { background: #0F172A; color: #E2E8F0; }
  body.dark .filter-bar { background: #1E293B; border-color: #334155; }
  body.dark .kpi-card, body.dark .chart-card, body.dark .table-card, body.dark .person-mini, body.dark .summary-card { background: #1E293B; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  body.dark .kpi-card .value { color: #F1F5F9; }
  body.dark .kpi-card .label, body.dark .kpi-card .sub { color: #94A3B8; }
  body.dark .chart-card h3, body.dark .table-card h3 { color: #F1F5F9; }
  body.dark th { background: #273449; color: #94A3B8; border-color: #334155; }
  body.dark td { border-color: #1E293B; color: #CBD5E1; }
  body.dark tr:hover td { background: rgba(217,119,6,0.08); }
  body.dark .group-tab { background: #273449; border-color: #334155; color: #94A3B8; }
  body.dark .group-tab:hover { border-color: #D97706; color: #D97706; }
  body.dark .group-tab.active { background: #D97706; border-color: #D97706; color: #fff; }
  body.dark .person-select, body.dark .date-input { background: #273449; border-color: #334155; color: #E2E8F0; }
  body.dark .date-shortcut { background: #273449; border-color: #334155; color: #94A3B8; }
  body.dark .date-shortcut:hover { border-color: #D97706; color: #D97706; }
  body.dark .date-shortcut.active { background: rgba(217,119,6,0.15); border-color: #D97706; color: #D97706; }
  body.dark .date-reset { background: #273449; border-color: #334155; color: #94A3B8; }
  body.dark .person-mini .name { color: #F1F5F9; }
  body.dark .person-mini .role { color: #64748B; }
  body.dark .person-mini .stat { color: #94A3B8; }
  body.dark .person-mini .stat span { color: #F1F5F9; }
  body.dark .person-mini:hover { border-color: #D97706; }
  body.dark .person-mini.active { border-color: #D97706; }
  body.dark .filter-label { color: #94A3B8; }
  body.dark .summary-card { border-top-color: #D97706; }
  body.dark .summary-body { color: #CBD5E1; }
  body.dark #summaryMonthSelect { background: #273449; border-color: #334155; color: #E2E8F0; }
  body.dark .copy-btn { border-color: #D97706; color: #D97706; background: transparent; }
  body.dark .copy-btn:hover { background: rgba(217,119,6,0.15); }
  body.dark .group-badge.g1 { background: rgba(24,144,255,0.15); }
  body.dark .group-badge.g2 { background: rgba(250,140,22,0.15); }
  body.dark .group-badge.g3 { background: rgba(82,196,26,0.15); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>运营团队 BI 看板</h1>
    <div class="date-info" id="headerDateInfo">数据周期: 2026年3月</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div style="text-align:right;">
      <div style="font-size:12px;opacity:0.6;margin-bottom:2px;">上次同步</div>
      <div id="lastSyncTime" style="font-size:13px;opacity:0.85;">—</div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 深色</button>
    <button id="syncBtn" onclick="syncData()" style="display:flex;align-items:center;gap:8px;padding:9px 20px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.12);color:#fff;font-size:14px;cursor:pointer;transition:all 0.2s;font-weight:500;">
      <span id="syncIcon" style="font-size:16px;display:inline-block;transition:transform 0.6s;">⟳</span>
      <span id="syncText">同步数据</span>
    </button>
  </div>
</div>

<div class="filter-bar" style="flex-direction:column;align-items:flex-start;gap:10px;">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <span class="filter-label">团队筛选:</span>
    <div class="group-tabs">
      <div class="group-tab active" onclick="filterGroup('全部')">全部</div>
      <div class="group-tab" onclick="filterGroup('运营一组')">运营一组</div>
      <div class="group-tab" onclick="filterGroup('运营二组')">运营二组</div>
      <div class="group-tab" onclick="filterGroup('运营三组')">运营三组</div>
    </div>
    <span class="filter-label">人员筛选:</span>
    <select class="person-select" id="personSelect" onchange="filterPerson(this.value)">
      <option value="全部">全部人员</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span class="filter-label">时间:</span>
    <div class="date-shortcuts" id="dateShortcuts">
      <div class="date-shortcut" onclick="quickDate('today',this)">日</div>
      <div class="date-shortcut" onclick="quickDate('yesterday',this)">昨日</div>
      <div class="date-shortcut" onclick="quickDate('week',this)">周</div>
      <div class="date-shortcut" onclick="quickDate('month',this)">月</div>
      <div class="date-shortcut" onclick="quickDate('quarter',this)">季</div>
      <div class="date-shortcut" onclick="quickDate('year',this)">年</div>
    </div>
    <input type="date" class="date-input" id="dateStart" value="2026-03-01" onchange="clearShortcutActive();filterDate()">
    <span style="font-size:13px;color:#999;">至</span>
    <input type="date" class="date-input" id="dateEnd" value="2026-03-31" onchange="clearShortcutActive();filterDate()">
    <div class="date-reset" onclick="resetDate()">重置</div>
  </div>
</div>

<div class="container">
  <div class="kpi-row" id="kpiRow"></div>

  <!-- 各组数据总览 -->
  <div id="groupOverviewSection">
    <div class="table-card" style="border-left:4px solid #1890ff;">
      <h3 style="display:flex;align-items:center;gap:8px;">🎬 运营一组 <span style="font-size:12px;color:#999;font-weight:400;">数据来源：组长表格</span></h3>
      <div class="kpi-row" id="op1Overview" style="grid-template-columns:repeat(6,1fr);"></div>
    </div>
    <div class="table-card" style="border-left:4px solid #fa8c16;margin-top:16px;">
      <h3 style="display:flex;align-items:center;gap:8px;">📈 运营二组 <span style="font-size:12px;color:#999;font-weight:400;">数据来源：组长表格</span></h3>
      <div class="kpi-row" id="op2Overview" style="grid-template-columns:repeat(3,1fr);"></div>
    </div>
    <div class="table-card" style="border-left:4px solid #52c41a;margin-top:16px;">
      <h3 style="display:flex;align-items:center;gap:8px;">🚀 运营三组 <span style="font-size:12px;color:#999;font-weight:400;">数据来源：组长表格</span></h3>
      <div class="kpi-row" id="op3Overview" style="grid-template-columns:repeat(3,1fr);"></div>
    </div>
  </div>

  <div id="personSection">
    <div class="table-card" style="border-top:3px solid #fa8c16;">
      <h3 style="display:flex;align-items:center;gap:8px;">👑 组长专区 <span style="font-size:12px;color:#999;font-weight:400;">组长及核心人员</span></h3>
      <div class="person-card-grid" id="leaderGrid"></div>
    </div>
    <div class="table-card">
      <h3>人员信息概览</h3>
      <div class="person-card-grid" id="personGrid"></div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <h3>各组工作量对比</h3>
      <div class="chart-wrap"><canvas id="groupChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>产品分布</h3>
      <div class="chart-wrap"><canvas id="productChart"></canvas></div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card full-width">
      <h3>每日工作量趋势</h3>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card full-width">
      <h3>人员工作量排名</h3>
      <div class="chart-wrap tall"><canvas id="personRankChart"></canvas></div>
    </div>
  </div>

  <div class="table-card">
    <h3 style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleDetail()">
      详细数据表
      <span id="detailArrow" style="font-size:18px;transition:transform 0.3s;">▼</span>
    </h3>
    <div id="detailWrap" style="display:none;overflow-x:auto;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>日期</th><th>姓名</th><th>组别</th><th>产品</th>
            <th>推片</th><th>标题关键词优化</th><th>剪辑视频</th><th>上传发布</th><th>审核</th><th>同步视频</th><th>合计</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 数据摘要（周/月/季/年） -->
  <div class="summary-card" id="summaryCard">
    <div class="summary-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:18px;">📋</span>
        <h3 style="margin:0;font-size:15px;font-weight:700;color:#1a1a2e;" id="summaryTitle">数据摘要</h3>
        <span style="font-size:12px;color:#999;font-weight:400;">可直接复制发给上级</span>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copySummary()">
        <span id="copyIcon">📋</span> 复制文字
      </button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;" id="summaryTabs">
      <div class="date-shortcut active" onclick="switchSummary('week',this)">本周</div>
      <div class="date-shortcut" onclick="switchSummary('month',this)">本月</div>
      <div class="date-shortcut" onclick="switchSummary('quarter',this)">本季</div>
      <div class="date-shortcut" onclick="switchSummary('year',this)">全年</div>
      <span style="font-size:12px;color:#999;margin-left:8px;">指定月份:</span>
      <select id="summaryMonthSelect" onchange="switchSummaryMonth(this.value)" style="padding:5px 10px;border-radius:16px;border:1px solid #d9d9d9;font-size:12px;outline:none;cursor:pointer;">
        <option value="">--</option>
      </select>
    </div>
    <div class="summary-body" id="summaryBody">
      <div style="color:#bbb;font-size:13px;padding:12px 0;">正在生成摘要…</div>
    </div>
  </div>
</div>

<script>
// ═══ Google Sheet 数据源配置 ═══
const SHEET_ID = '19Eh91Ztt6Em_admci9E3LRhLI8TG10lLytL9CeJgeQY';
const KPI_SHEET = {id:'15SyB0Z_spvYigyiE1ohd6Z3EhyqXoyy8OlO1HYR1w5g',gid:'959809761'};

function splitCSVLine(line){
  const result=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"')inQ=!inQ;
    else if(c===','&&!inQ){result.push(cur.trim());cur='';}
    else cur+=c;
  }
  result.push(cur.trim());
  return result.map(v=>v.replace(/^"|"$/g,'').trim());
}
function parseNum(s){return Number(String(s||'').replace(/,/g,''))||0;}

async function fetchCSV(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.text();
}

function normalizeGroup(g){
  return (g||'').replace('1组','一组').replace('2组','二组').replace('3组','三组');
}

// 名字修正：统一繁简体、去除多余空格
const NAME_FIX = {'輝鍋':'辉锅','双髻鯊':'双髻鲨'};
function normalizeName(n){
  n = (n||'').trim();
  return NAME_FIX[n] || n;
}

async function loadStaffFromSheet(){
  const text=await fetchCSV(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`);
  const lines=text.trim().split('\n');
  const staff=[];
  for(let i=1;i<lines.length;i++){
    const cols=splitCSVLine(lines[i]);
    if(!cols[0])continue;
    staff.push({name:cols[0],group:normalizeGroup(cols[1]),role:cols[2]||'',id:cols[3]||'',joinDate:cols[4]||'',products:cols[8]||''});
  }
  return staff;
}

function parseWorkRows(text, skipRows){
  const lines=text.trim().split('\n');
  const rows=[];
  for(let i=skipRows;i<lines.length;i++){
    const cols=splitCSVLine(lines[i]);
    const dateStr=cols[0]||'';
    const name=cols[1]||'';
    const group=cols[2]||'';
    if(!dateStr||!name||name==='姓名'||name==='人员信息'||name==='人员信息 姓名'||name==='人员信息 日期')continue;
    if(!parseDate(dateStr))continue;
    rows.push([dateStr,normalizeName(name),normalizeGroup(group),cols[3]||'',parseNum(cols[4]),parseNum(cols[5]),parseNum(cols[6]),parseNum(cols[7]),parseNum(cols[8]),parseNum(cols[9])]);
  }
  return rows;
}

function parseLastYearSheet(text){
  // 纵向格式解析：
  // 第一行: "日期 姓名 组别 产品名称","2025.1/1 全组 运营一组 汇总"
  // 后续行: "推片","29085" ...
  // 遇到新的 "日期","" 开始下一段
  const lines=text.trim().split('\n');
  const rows=[];
  let curDate='',curName='',curGroup='',curProduct='';
  let curMetrics={};
  const FIELD_MAP={'推片':4,'标题关键词优化':5,'剪辑视频':6,'上传发布':7,'审核':8,'同步视频':9};

  function flush(){
    if(curDate && parseDate(curDate)){
      const row=[curDate,curName,normalizeGroup(curGroup),curProduct,
        parseNum(curMetrics['推片']),parseNum(curMetrics['标题关键词优化']),
        parseNum(curMetrics['剪辑视频']),parseNum(curMetrics['上传发布']),
        parseNum(curMetrics['审核']),parseNum(curMetrics['同步视频'])];
      // 只加有数据的行
      if(row.slice(4).some(v=>v>0)) rows.push(row);
    }
    curMetrics={};
  }

  for(let i=0;i<lines.length;i++){
    const cols=splitCSVLine(lines[i]);
    const c0=(cols[0]||'').trim();
    const c1=(cols[1]||'').trim();

    if(c0.startsWith('日期')){
      flush();
      // 解析 "日期 姓名 组别 产品名称" 和 "2025.1/1 全组 运营一组 汇总"
      const headerParts=c0.split(/\s+/);
      const valueParts=c1.split(/\s+/);
      curDate=valueParts[0]||'';
      curName=valueParts[1]||'全组';
      curGroup=valueParts[2]||'';
      curProduct=valueParts[3]||'汇总';
      // 如果只有 "日期" 没有值，可能是空分隔行
      if(!curDate && headerParts.length===1){
        // 尝试读下面几行找日期/姓名/组别/产品
        curDate='';curName='';curGroup='';curProduct='';
      }
    } else if(c0==='姓名'&&c1){curName=c1;}
    else if(c0==='组别'&&c1){curGroup=c1;}
    else if(c0==='产品名称'&&c1){curProduct=c1;}
    else if(FIELD_MAP[c0]!==undefined){
      curMetrics[c0]=c1;
    }
  }
  flush();
  return rows;
}

function parseOp1Leader(text){
  const lines=text.trim().split('\n').map(l=>splitCSVLine(l));
  if(lines.length<3) return [];
  const rows=[];
  // 第1行：年份和日期 "2026","3/30","","","","","","3/31",...

    'Web 优化上架','91探花 视频','禁漫天堂 漫画','禁漫天堂 小说','禁漫天堂 视频','91 hub 视频','KISSAV 视频',
    '其他','第一吃瓜网 帖子审核','抖阴成人 视频分类质检','91探花 已上架视频优化','91探花 违禁词排查'];

    if(ALL_OP1_METRICS.includes(label)){
      dateBlocks.forEach(db=>{
        db.persons.forEach(p=>{
          const val=parseNum(lines[r][p.col]);
          if(val>0) op1Detail[label]=(op1Detail[label]||0)+val;
        });
      });
    }
    const metric=METRIC_MAP[label];
    if(!metric) continue;
    const metricIdx=metricNames.indexOf(metric);
    if(metricIdx<0) continue;

    dateBlocks.forEach(db=>{
      db.persons.forEach(p=>{
        const val=parseNum(lines[r][p.col]);

function parseOp2Leader(text){
  const lines=text.trim().split('\n');

    const wNum=parseInt((week||'').replace(/\D/g,''))||1;
    const dateStr=`${mMatch[1]}.${mMatch[2]}/${Math.min(28,(wNum-1)*7+1)}`;

    rows.push([dateStr,name,'运营二组','汇总',sales,0,produce,0,0,sync]);
  }
  // 汇总
  const op2Detail={'资源平台同步':0,'视频制作':0,'视频销量':0};

  console.log('运营二组(组长表)解析:', rows.length, '条');
  return rows;
}

let dateEnd   = '2026-03-31';

// 把 "2026.3/4" → "2026-03-04" 方便跨月比对
function parseDate(dateStr) {
  // 支持 "2026.3/4" "2026/1/1" "2026-03-04" "2026.1/1" 等格式
  let m = dateStr.match(/(\d{4})[\.\/\-](\d{1,2})[\.\/\-](\d{1,2})/);
  if (!m) {
    m = dateStr.match(/(\d{4})\.(\d{1,2})\/(\d{1,2})/);
  }
  if (!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}

// 用实际今天日期，不受表格中未来数据影响
function getLatestDate() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function getFiltered() {
  let d = workData;
  if (currentGroup !== "全部") d = d.filter(r => r[2] === currentGroup);
  if (currentPerson !== "全部") d = d.filter(r => r[1] === currentPerson);
  d = d.filter(r => { const dt = parseDate(r[0]); return dt >= dateStart && dt <= dateEnd; });
  return d;
}

function filterDate() {
  const s = document.getElementById('dateStart').value;
  const e = document.getElementById('dateEnd').value;
  if (s) dateStart = s;
  if (e) dateEnd   = e;
  render();
}

function resetDate() {
  const latest = getLatestDate();
  const ym = latest.slice(0,7);
  dateStart = ym + '-01';
  dateEnd   = latest;
  document.getElementById('dateStart').value = dateStart;
  document.getElementById('dateEnd').value   = dateEnd;
  clearShortcutActive();
  render();
}

function clearShortcutActive() {
  document.querySelectorAll('.date-shortcut').forEach(el => el.classList.remove('active'));
}

function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function quickDate(type, el) {
  const today = getLatestDate();
  const ym    = today.slice(0,7);
  let sDate, eDate;
  switch(type) {
    case 'today':     sDate = eDate = today; break;
    case 'yesterday': sDate = eDate = addDays(today, -1); break;
    case 'week':      sDate = addDays(today, -6); eDate = today; break;
    case 'month':     sDate = ym + '-01'; eDate = today; break;
    case 'quarter': {
      const mo = parseInt(today.slice(5,7));
      const qStart = mo <= 3 ? 1 : mo <= 6 ? 4 : mo <= 9 ? 7 : 10;
      sDate = `${today.slice(0,4)}-${String(qStart).padStart(2,'0')}-01`;
      eDate = today; break;
    }
    case 'year': sDate = today.slice(0,4) + '-01-01'; eDate = today; break;
  }
  dateStart = sDate; dateEnd = eDate;
  document.getElementById('dateStart').value = sDate;
  document.getElementById('dateEnd').value   = eDate;
  clearShortcutActive();
  if (el) el.classList.add('active');
  render();
}

function sumMetric(data, idx) { return data.reduce((s, r) => s + r[idx], 0); }

function getPrevPeriodData() {
  // 计算上一个同等时长的时间段
  const ms = new Date(dateStart).getTime();
  const me = new Date(dateEnd).getTime();
  const duration = me - ms; // 毫秒
  const prevEnd   = new Date(ms - 86400000).toISOString().slice(0,10);
  const prevStart = new Date(ms - 86400000 - duration).toISOString().slice(0,10);
  let d = workData;
  if (currentGroup !== "全部") d = d.filter(r => r[2] === currentGroup);
  if (currentPerson !== "全部") d = d.filter(r => r[1] === currentPerson);
  const result = d.filter(r => { const dt = parseDate(r[0]); return dt >= prevStart && dt <= prevEnd; });
  return result.length ? result : null;
}

function trendHTML(cur, prev) {
  if (prev === null) return '<div class="kpi-trend flat">环比: 暂无上期数据</div>';
  if (prev === 0 && cur === 0) return '<div class="kpi-trend flat">环比: —</div>';
  if (prev === 0) return '<div class="kpi-trend up">环比: ↑ 新增</div>';
  const pct = ((cur - prev) / prev * 100).toFixed(1);
  if (pct > 0) return `<div class="kpi-trend up">环比: ↑ +${pct}%</div>`;
  if (pct < 0) return `<div class="kpi-trend down">环比: ↓ ${pct}%</div>`;
  return '<div class="kpi-trend flat">环比: — 0%</div>';
}

function updateKPIs() {
  const data = getFiltered();
  const prevData = getPrevPeriodData();
  const indices = [4,5,6,7,8,9];
  const labels = ["推片总量","标题关键词优化","剪辑视频","上传发布","审核","同步视频"];
  const colors = ["#1890ff","#722ed1","#13c2c2","#eb2f96","#fa8c16","#52c41a"];
  const html = indices.map((idx, i) => {
    const cur = sumMetric(data, idx);
    const prev = prevData ? sumMetric(prevData, idx) : null;
    return `
    <div class="kpi-card">
      <div class="label">${labels[i]}</div>
      <div class="value" style="color:${colors[i]}">${cur.toLocaleString()}</div>
      <div class="sub">日均 ${(cur / Math.max(1, Math.round((new Date(dateEnd)-new Date(dateStart))/86400000)+1)).toFixed(1)} | ${dateStart.slice(5).replace('-','/')} ~ ${dateEnd.slice(5).replace('-','/')}</div>
      ${trendHTML(cur, prev)}
    </div>`;
  }).join('');
  document.getElementById('kpiRow').innerHTML = html;
}

const LEADERS = ['辉锅','杜兰特','凯瑞莎','柚子','庆记'];

function getLeaderEval(name, total, days, pData) {
  if(!pData.length) return { grade:'-', color:'#bbb', emoji:'❓', comment:'本期暂无数据记录。', detail:'' };

  // ═══ 各指标汇总 ═══
  const metrics = {};
  metricNames.forEach((m,i) => { metrics[m] = pData.reduce((s,r) => s + r[i+4], 0); });
  const sorted = metricNames.map(m => ({name:m, val:metrics[m]})).sort((a,b) => b.val - a.val);
  const best = sorted[0], worst = sorted.filter(s=>s.val>0).pop() || sorted[sorted.length-1];

  // ═══ 1. 目标达成情况 (50%) ═══
  // 目标值 = 同组同期所有人的平均值（动态基准）
  const groupData = workData.filter(r => {
    const p = personnelInfo.find(pi => pi.name === r[1]);
    const myGroup = personnelInfo.find(pi => pi.name === name);
    if(!p || !myGroup) return false;
    const dt = parseDate(r[0]);
    return p.group === myGroup.group && dt >= dateStart && dt <= dateEnd;
  });
  const groupPersons = {};
  groupData.forEach(r => {
    groupPersons[r[1]] = (groupPersons[r[1]]||0) + r[4]+r[5]+r[6]+r[7]+r[8]+r[9];
  });
  const gpValues = Object.values(groupPersons);
  const groupAvg = gpValues.length ? Math.round(gpValues.reduce((s,v)=>s+v,0) / gpValues.length) : 0;
  const target = groupAvg || 1;
  const achieveRate = Math.round(total / target * 100);
  const achieveScore = Math.min(100, achieveRate); // 满分100

  // ═══ 2. 工作态度与质量 (30%) ═══
  // 衡量：覆盖指标数（广度）+ 产出均衡度（无明显短板）
  const activeMetrics = metricNames.filter(m => metrics[m] > 0).length;
  const breadthScore = Math.round(activeMetrics / metricNames.length * 100); // 覆盖率
  // 均衡度：最高指标与最低有效指标的比值，越接近1越均衡
  const activeVals = sorted.filter(s=>s.val>0).map(s=>s.val);
  const balanceScore = activeVals.length >= 2 ? Math.round(Math.min(activeVals[activeVals.length-1],activeVals[0]) / Math.max(activeVals[activeVals.length-1],activeVals[0]) * 100) : 50;
  const qualityScore = Math.round(breadthScore * 0.6 + balanceScore * 0.4);

  // ═══ 加权总分 ═══
  const finalScore = Math.round(achieveScore * 0.5 + qualityScore * 0.3 + Math.min(100, achieveRate) * 0.2);

  let grade, color, emoji;
  if(finalScore >= 90) { grade='S'; color='#faad14'; emoji='🏆'; }
  else if(finalScore >= 75) { grade='A'; color='#52c41a'; emoji='⭐'; }
  else if(finalScore >= 60) { grade='B'; color='#1890ff'; emoji='👍'; }
  else if(finalScore >= 40) { grade='C'; color='#fa8c16'; emoji='📊'; }
  else { grade='D'; color='#ff4d4f'; emoji='⚠️'; }

  // ═══ 评语生成 ═══
  // 目标达成评语
  const achieveWord = achieveRate >= 120 ? '远超目标' : achieveRate >= 100 ? '达成目标' : achieveRate >= 80 ? '接近目标' : '未达目标';
  const achieveColor = achieveRate >= 100 ? 'txt-good' : achieveRate >= 80 ? 'txt-warn' : 'txt-danger';

  // 各指标明细
  const metricDetail = metricNames.map(m => `${m} ${metrics[m].toLocaleString()}`).join('、');

  // 质量评语
  let qualityComment;
  if(qualityScore >= 80) qualityComment = '工作覆盖全面，各项指标均衡，交付质量优秀，无明显短板。';
  else if(qualityScore >= 60) qualityComment = `工作质量良好，${worst.name}产出相对较低（${worst.val}），建议适当加强。`;
  else if(qualityScore >= 40) qualityComment = `工作覆盖面有限（${activeMetrics}/${metricNames.length}项），${worst.name}明显薄弱，需改善工作均衡性。`;
  else qualityComment = `工作集中在少数指标，覆盖不足，建议拓展工作范围，提升综合能力。`;

  const comment = `<b>【目标达成·50%】</b><span class="${achieveColor}">${achieveWord}</span>｜本期总产量 <b>${total.toLocaleString()}</b>，组内目标均值 <b>${target.toLocaleString()}</b>，达成率 <b class="${achieveColor}">${achieveRate}%</b>。明细：${metricDetail}。`
    + `<br><b>【工作质量·30%】</b>${qualityComment}`
    + `<br><b>【综合评分】</b>${finalScore}分（达成${achieveScore}×50% + 质量${qualityScore}×30% + 贡献${Math.min(100,achieveRate)}×20%）`;

  const detail = `强项：${best.name}(${best.val.toLocaleString()})｜需加强：${worst.name}(${worst.val.toLocaleString()})`;

  return { grade, color, emoji, comment, detail, finalScore };
}

function buildPersonCard(p, isLeader) {
  const pData = workData.filter(r => r[1] === p.name && parseDate(r[0]) >= dateStart && parseDate(r[0]) <= dateEnd);
  const total = pData.reduce((s,r) => s+r[4]+r[5]+r[6]+r[7]+r[8]+r[9], 0);
  const gc = p.group === "运营一组" ? "g1" : p.group === "运营二组" ? "g2" : "g3";
  const days = pData.length;

  let evalHTML = '';
  if(isLeader) {
    const ev = getLeaderEval(p.name, total, days, pData);
    evalHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid ${document.body.classList.contains('dark')?'rgba(255,255,255,0.08)':'#f0f0f0'};">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
          <span style="font-size:16px;">${ev.emoji}</span>
          <span style="font-size:22px;font-weight:800;color:${ev.color};">${ev.grade}</span>
          ${ev.finalScore ? `<span style="font-size:12px;color:#999;">${ev.finalScore}分</span>` : ''}
        </div>
        <div style="font-size:11px;line-height:1.8;color:${document.body.classList.contains('dark')?'#94A3B8':'#555'};">${ev.comment}</div>
        ${ev.detail ? `<div style="font-size:11px;color:#999;margin-top:4px;">${ev.detail}</div>` : ''}
      </div>`;
  }

  return `
    <div class="person-mini ${currentPerson===p.name?'active':''}" onclick="filterPerson('${p.name}');document.getElementById('personSelect').value='${p.name}'">
      <div class="name">${p.name} <span class="group-badge ${gc}">${p.group}</span></div>
      <div class="role">${p.role} | ${p.id}</div>
      <div class="stats">
        <div class="stat"><span>${days}</span>记录数</div>
        <div class="stat"><span>${total}</span>总工作量</div>
        <div class="stat"><span>${days?Math.round(total/days):0}</span>日均</div>
      </div>
      ${evalHTML}
    </div>`;
}

// ─── 数据同步 ───────────────────────────────────────────────
let isSyncing = false;

function formatTime(d) {
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${hh}:${mm}:${ss}`;
}

function showToast(msg, icon='✅') {
  let t = document.getElementById('syncToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'syncToast';
    t.className = 'sync-toast';
    document.body.appendChild(t);
  }
  t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function syncData() {
  if (isSyncing) return;
  isSyncing = true;
  const btn = document.getElementById('syncBtn');
  const icon = document.getElementById('syncIcon');
  const txt = document.getElementById('syncText');
  btn.disabled = true;
  txt.textContent = '同步中…';
  let deg = 0;
  const spin = setInterval(() => {
    deg += 20;
    icon.style.transform = `rotate(${deg}deg)`;
  }, 50);
  try {
    const [staff, work] = await Promise.all([loadStaffFromSheet(), loadWorkFromSheet()]);
    personnelInfo = staff;
    workData = work;
    clearInterval(spin);
    icon.style.transform = 'rotate(0deg)';
    btn.disabled = false;
    txt.textContent = '同步数据';
    isSyncing = false;
    const now = new Date();
    document.getElementById('lastSyncTime').textContent = formatTime(now);
    showToast(`数据同步完成，共 ${work.length} 条记录`, '✅');
    // 自动设置日期范围为最新数据
    const latest = getLatestDate();
    const ym = latest.slice(0,7);
    dateStart = ym + '-01';
    dateEnd = latest;
    document.getElementById('dateStart').value = dateStart;
    document.getElementById('dateEnd').value = dateEnd;
    const y = latest.slice(0,4), mo = parseInt(latest.slice(5,7));
    document.getElementById('headerDateInfo').textContent = `数据周期: ${y}年${mo}月`;
    updatePersonSelect();
    populateMonthSelect();
    render();
    updateSummary();
  } catch(e) {
    clearInterval(spin);
    icon.style.transform = 'rotate(0deg)';
    btn.disabled = false;
    txt.textContent = '同步数据';
    isSyncing = false;
    showToast('同步失败：' + e.message, '❌');
    console.error(e);
  }
}

// 预警阈值配置
const THRESHOLDS = {
  push:   { good: 800, warn: 600 },
  title:  { good: 700, warn: 500 },
  edit:   { good: 200, warn: 150 },
  upload: { good: 1000, warn: 800 },
  review: { good: 700, warn: 500 },
  sync:   { good: 300, warn: 200 },
};

function grade(val, key) {
  const t = THRESHOLDS[key];
  if (val >= t.good) return 'good';
  if (val >= t.warn) return 'warn';
  return 'danger';
}

function span(text, lvl) {
  return `<span class="txt-${lvl} txt-${lvl}-bg">${text}</span>`;
}

function pctChange(cur, prev) {
  if (!prev) return null;
  return ((cur - prev) / prev * 100).toFixed(1);
}

function dirWord(pct, higher_is_better=true) {
  if (pct === null) return null;
  const up = parseFloat(pct) > 0;
  return up === higher_is_better
    ? { word: '上升', lvl: 'good' }
    : { word: '下降', lvl: 'danger' };
}

let currentSummaryMonth = '';

function populateMonthSelect() {
  const months = {};
  workData.forEach(r => {
    const dt = parseDate(r[0]);
    if(dt) { const ym = dt.slice(0,7); months[ym] = true; }
  });
  const sorted = Object.keys(months).sort().reverse();
  const sel = document.getElementById('summaryMonthSelect');
  sel.innerHTML = '<option value="">--</option>' + sorted.map(ym => {
    const [y,m] = ym.split('-');
    return `<option value="${ym}">${y}年${parseInt(m)}月</option>`;
  }).join('');
}

function getSummaryRange(tab) {
  const latest = getLatestDate();
  const y = latest.slice(0,4);
  const m = parseInt(latest.slice(5,7));
  let sDate, eDate, label, prevStart, prevEnd, prevLabel;

  if(tab === 'custom_month') {
    const ym = currentSummaryMonth; // "2026-03"
    const [cy, cm] = ym.split('-').map(Number);
    sDate = `${ym}-01`;
    const lastDay = new Date(cy, cm, 0).getDate();
    eDate = `${ym}-${lastDay}`;
    label = `${cy}年${cm}月`;
    const pm = cm - 1 > 0 ? cm - 1 : 12;
    const py = cm - 1 > 0 ? cy : cy - 1;
    prevStart = `${py}-${String(pm).padStart(2,'0')}-01`;
    const prevLastDay = new Date(py, pm, 0).getDate();
    prevEnd = `${py}-${String(pm).padStart(2,'0')}-${prevLastDay}`;
    prevLabel = `${py}年${pm}月`;
  } else if(tab === 'week') {
    eDate = latest;
    sDate = addDays(latest, -6);
    label = '本周';
    prevEnd = addDays(sDate, -1);
    prevStart = addDays(prevEnd, -6);
    prevLabel = '上周';
  } else if(tab === 'month') {
    sDate = `${y}-${String(m).padStart(2,'0')}-01`;
    eDate = latest;
    label = `${m}月`;
    const pm = m - 1 > 0 ? m - 1 : 12;
    const py = m - 1 > 0 ? y : String(parseInt(y)-1);
    prevStart = `${py}-${String(pm).padStart(2,'0')}-01`;
    const lastDay = new Date(parseInt(py), pm, 0).getDate();
    prevEnd = `${py}-${String(pm).padStart(2,'0')}-${lastDay}`;
    prevLabel = `${pm}月`;
  } else if(tab === 'quarter') {
    const qStart = m <= 3 ? 1 : m <= 6 ? 4 : m <= 9 ? 7 : 10;
    sDate = `${y}-${String(qStart).padStart(2,'0')}-01`;
    eDate = latest;
    label = `Q${Math.ceil(m/3)}`;
    const pqStart = qStart - 3 > 0 ? qStart - 3 : qStart - 3 + 12;
    const pqEnd = qStart - 1 > 0 ? qStart - 1 : 12;
    const py = pqStart > qStart ? String(parseInt(y)-1) : y;
    prevStart = `${py}-${String(pqStart).padStart(2,'0')}-01`;
    const lastDay = new Date(parseInt(py), pqEnd, 0).getDate();
    prevEnd = `${py}-${String(pqEnd).padStart(2,'0')}-${lastDay}`;
    prevLabel = `上季`;
  } else { // year
    sDate = `${y}-01-01`;
    eDate = latest;
    label = `${y}年`;
    prevStart = `${parseInt(y)-1}-01-01`;
    prevEnd = `${parseInt(y)-1}-12-31`;
    prevLabel = `${parseInt(y)-1}年`;
  }
  return { sDate, eDate, label, prevStart, prevEnd, prevLabel };
}

function updateSummary() {
  const range = getSummaryRange(currentSummaryTab);
  document.getElementById('summaryTitle').textContent = `${range.label}数据摘要`;

  console.log('摘要范围:', range.sDate, '~', range.eDate, '| 上期:', range.prevStart, '~', range.prevEnd);
  console.log('workData总量:', workData.length, '| 前5条日期:', workData.slice(0,5).map(r=>r[0]+' -> '+parseDate(r[0])));
  const allData = workData.filter(r => { const dt = parseDate(r[0]); return dt >= range.sDate && dt <= range.eDate; });
  const prevAllData = workData.filter(r => { const dt = parseDate(r[0]); return dt >= range.prevStart && dt <= range.prevEnd; });
  console.log('本期匹配:', allData.length, '条 | 上期匹配:', prevAllData.length, '条');

  const keys = ['push','title','edit','upload','review','sync'];
  const idxMap = { push:4, title:5, edit:6, upload:7, review:8, sync:9 };
  const nameMap = { push:'推片总量', title:'标题关键词优化', edit:'剪辑视频', upload:'上传发布', review:'审核', sync:'同步视频' };

  const cur = {};
  keys.forEach(k => { cur[k] = sumMetric(allData, idxMap[k]); });

  const prev = {};
  const hasPrev = prevAllData.length > 0;
  keys.forEach(k => { prev[k] = hasPrev ? sumMetric(prevAllData, idxMap[k]) : null; });

  // 人员统计
  const personTotals = {};
  const personDays = {};
  allData.forEach(r => {
    const n = r[1]; const tot = r[4]+r[5]+r[6]+r[7]+r[8]+r[9];
    personTotals[n] = (personTotals[n]||0) + tot;
    personDays[n] = (personDays[n]||0) + 1;
  });
  const sorted = Object.entries(personTotals).sort((a,b)=>b[1]-a[1]);
  const top = sorted[0], bottom = sorted[sorted.length-1];
  const activeCount = sorted.length;
  const totalWork = Object.values(personTotals).reduce((s,v)=>s+v,0);
  const avgWork = Math.round(totalWork / activeCount);

  // 组别统计
  const groupTotals = { '运营一组':0, '运营二组':0, '运营三组':0 };
  allData.forEach(r => { const tot = r[4]+r[5]+r[6]+r[7]+r[8]+r[9]; groupTotals[r[2]] = (groupTotals[r[2]]||0)+tot; });
  const bestGroup = Object.entries(groupTotals).sort((a,b)=>b[1]-a[1])[0];

  const pLabel = range.label;
  const ppLabel = range.prevLabel;

  // 构建摘要段落
  const lines = [];

  if(!allData.length){
    lines.push(`${pLabel}暂无数据记录。`);
    document.getElementById('summaryBody').innerHTML = lines.map(l=>`<p>${l}</p>`).join('');
    return;
  }

  // 环比辅助
  function envCompare(curVal, prevVal, label) {
    if(!hasPrev || prevVal===null) return `（${ppLabel}无数据，暂无环比）`;
    const p = pctChange(curVal, prevVal);
    const d = dirWord(p);
    if(d===null) return '';
    return `，较${ppLabel}${span(d.word+' '+Math.abs(p)+'%', d.lvl)}`;
  }

  // 总量概况
  const totalAll = keys.reduce((s,k)=>s+cur[k], 0);
  const totalPrev = hasPrev ? keys.reduce((s,k)=>s+(prev[k]||0), 0) : null;
  const totalPct = pctChange(totalAll, totalPrev);
  const totalDir = dirWord(totalPct);
  if(totalDir) {
    lines.push(`${pLabel}运营团队累计完成各项工作 ${span(totalAll.toLocaleString()+'项', 'good')}，较${ppLabel}整体${span(totalDir.word+' '+Math.abs(totalPct)+'%', totalDir.lvl)}，运营产能${parseFloat(totalPct)>0?span('增长','good'):span('收缩','warn')}。`);
  } else {
    lines.push(`${pLabel}运营团队累计完成各项工作 ${span(totalAll.toLocaleString()+'项', 'good')}（${ppLabel}无数据，暂无环比）。`);
  }

  // 各指标
  keys.forEach(k => {
    const lvl = grade(cur[k], k);
    const env = envCompare(cur[k], prev[k], nameMap[k]);
    lines.push(`${nameMap[k]}完成 ${span(cur[k].toLocaleString(), lvl)}${env}。`);
  });

  // 人员排名
  if(sorted.length) {
    lines.push(`${pLabel}共 ${span(activeCount+'名','good')} 运营人员参与记录，总工作量合计 ${span(totalWork.toLocaleString(), 'good')} 项，人均 ${span(avgWork, avgWork>=200?'good':'warn')} 项/人。${span(top[0], 'good')} 工作量最高达 ${span(top[1], 'good')} 项；${span(bottom[0], 'warn')} 工作量为 ${span(bottom[1], 'warn')} 项，${span('建议关注','warn')}。`);
  }

  // 最佳组别
  if(bestGroup) {
    lines.push(`三组中，${span(bestGroup[0], 'good')} ${pLabel}工作量最高，达 ${span(bestGroup[1].toLocaleString(), 'good')} 项。`);
  }

  const html = lines.map(l => `<p>${l}</p>`).join('');
  document.getElementById('summaryBody').innerHTML = html;
}

function copySummary() {
  const body = document.getElementById('summaryBody');
  // 提取纯文字（去掉 HTML 标签）
  const plainText = body.innerText || body.textContent;
  navigator.clipboard.writeText(plainText).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = '<span>✅</span> 已复制！';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>📋</span> 复制文字';
    }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = plainText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板', '📋');
  });
}

// ═══ 深浅模式切换 ═══
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark=document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent=isDark?'☀️ 浅色':'🌙 深色';
  localStorage.setItem('bi-theme',isDark?'dark':'light');
  // 重新渲染图表以适配主题
  if(workData.length){render();}
}
// 读取上次主题设置
if(localStorage.getItem('bi-theme')==='dark'){
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent='☀️ 浅色';
}

// 初始化：自动从 Google Sheet 加载数据
syncData();

// 初始化同步时间 & 摘要
document.getElementById('lastSyncTime').textContent = formatTime(new Date());
updateSummary();
</script>
